[package]
name = "vtsampler"
version = "0.1.1"
edition = "2024"
description = "Cross-platform GPU video format conversion and scaling (wgpu compute)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mycrl/VTSampler"
homepage = "https://github.com/mycrl/VTSampler"
documentation = "https://docs.rs/vtsampler"
keywords = ["video", "wgpu", "gpu", "yuv", "nv12"]
categories = ["graphics", "multimedia::video"]

[package.metadata.docs.rs]
all-features = false
default-target = "x86_64-pc-windows-msvc"
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
wgpu = "23"
smallvec = "1.15.1"
minijinja = "2.8.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-video = "0.3"
objc2-metal = "0.3"
metal = "0.29"
block2 = "0.6"

[dev-dependencies]
winit = "0.30.11"
anyhow = "1.0.98"
pollster = "0.4"
bytemuck = { version = "1.17", features = ["derive"] }
